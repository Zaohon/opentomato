replicaCount: 1

imagePullSecrets:
  - name: hems-agent-acr-registry-shanghai

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
  hosts:
    - host: agent-dev.felicitysolar-shanghai.com
      paths:
        - path: /api/v1
          pathType: Prefix

probes:
  periodSeconds: 60

env:
  LOG_OUTPUT: both
  LOG_LANGUAGE: cn
  LOG_TIMING_ENABLED: "true"
  FLS_BACKEND_BASE_URL: "https://api-dev.felicitysolar-shanghai.com/api"
  OPENVIKING_ENABLED: "true"
  OPENVIKING_STRONG_ISOLATION: "true"
  OPENVIKING_URL: "http://openviking:1933"
