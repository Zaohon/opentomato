stages:
  - verify
  - build
  - deploy
  - smoke

variables:
  # Keep Kubernetes runner source checkout small; Shanghai runner has failed
  # during fetch-pack transfer before any job script can execute.
  GIT_DEPTH: "1"
  GIT_FETCH_EXTRA_FLAGS: "--no-tags --prune --quiet"
  GIT_SUBMODULE_STRATEGY: "none"

  DEV_NAMESPACE: "fls-dev"
  HELM_RELEASE: "hems-agent-backend"
  CHART_DIR: "chart/hems-agent-backend"
  IMAGE_PULL_SECRET: "hems-agent-acr-registry"
  ENV_SECRET_NAME: "hems-agent-backend-env"
  EXPECTED_DEV_ACR_REGISTRY: "fls-acr-dev-registry-vpc.eu-central-1.cr.aliyuncs.com"
  SH_DEV_NAMESPACE: "fls-dev"
  SH_IMAGE_PULL_SECRET: "hems-agent-acr-registry-shanghai"
  SH_ENV_SECRET_NAME: "hems-agent-backend-env"
  SH_ACR_REGISTRY: "fls-dsw-registry-vpc.cn-shanghai.cr.aliyuncs.com"
  SH_ACR_IMAGE_REPO: "fesolarsh/hems-agent-backend"
  SH_PYTHON_BASE_IMAGE: "$SH_ACR_REGISTRY/fesolarsh/python:3.11-slim"
  SH_PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  SH_PIP_TRUSTED_HOST: "mirrors.aliyun.com"
  GITLAB_ARCHIVE_API_BASE: "https://8.209.125.206/api/v4"
  SH_CI_CONTEXT_FILE: "ci%2Fsh-context.tar.gz"
  AWS_REGION: "eu-central-1"
  AWS_DEV_NAMESPACE: "fls-dev"
  AWS_ECR_REGISTRY: "041492853875.dkr.ecr.eu-central-1.amazonaws.com"
  AWS_ECR_REPOSITORY: "fls/hems-agent-backend"

  PYTHON_IMAGE: "docker.m.daocloud.io/library/python:3.11-alpine"
  KANIKO_IMAGE: "registry.gitlab.com/kaniko-project/executor:debug"
  SH_KANIKO_IMAGE: "registry.gitlab.com/kaniko-project/executor:debug"
  BUILDAH_IMAGE: "docker.m.daocloud.io/quay.io/buildah/stable"
  HELM_IMAGE: "docker.m.daocloud.io/alpine/helm:3.14.4"
  KUBECTL_IMAGE: "docker.m.daocloud.io/alpine/k8s:1.29.15"
  CURL_IMAGE: "docker.m.daocloud.io/curlimages/curl:8.5.0"
  SH_HELM_IMAGE: "docker.m.daocloud.io/alpine/helm:3.14.4"
  SH_KUBECTL_IMAGE: "docker.m.daocloud.io/alpine/k8s:1.29.15"
  SH_CURL_IMAGE: "docker.m.daocloud.io/curlimages/curl:8.5.0"

default:
  tags: ["ack-dev"]

.fetch_sh_ci_context: &fetch_sh_ci_context |
  set -eu
  run_cmd() {
    cmd="$1"
    shift
    if command -v "$cmd" >/dev/null 2>&1; then
      "$cmd" "$@"
    elif [ -x "/busybox/$cmd" ]; then
      "/busybox/$cmd" "$@"
    else
      echo "Required command not found: $cmd"
      exit 1
    fi
  }

  ARCHIVE_API_BASE="${GITLAB_ARCHIVE_API_BASE:-$CI_API_V4_URL}"
  CONTEXT_FILE="${SH_CI_CONTEXT_FILE:-ci%2Fsh-context.tar.gz}"
  CONTEXT_URL="$ARCHIVE_API_BASE/projects/$CI_PROJECT_ID/repository/files/$CONTEXT_FILE/raw?ref=$CI_COMMIT_SHA"
  if [ -n "${GITLAB_ARCHIVE_PRIVATE_TOKEN:-}" ]; then
    AUTH_HEADER="PRIVATE-TOKEN: $GITLAB_ARCHIVE_PRIVATE_TOKEN"
  else
    AUTH_HEADER="JOB-TOKEN: $CI_JOB_TOKEN"
  fi

  echo "Downloading Shanghai CI context from $ARCHIVE_API_BASE"
  if command -v curl >/dev/null 2>&1; then
    curl -fsSLk --connect-timeout 20 --max-time 120 --header "$AUTH_HEADER" "$CONTEXT_URL" -o sh-context.tar.gz
  else
    run_cmd wget -T 120 -q --header "$AUTH_HEADER" -O sh-context.tar.gz "$CONTEXT_URL"
  fi

  echo "Extracting Shanghai CI context"
  run_cmd tar -xzf sh-context.tar.gz -C "$CI_PROJECT_DIR"

verify:
  stage: verify
  image: $PYTHON_IMAGE
  script:
    - pip install -r requirements.txt
    - python -m compileall app
    - python -c "import pymysql"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build_image:
  stage: build
  image:
    name: $SH_KANIKO_IMAGE
    entrypoint: [""]
  script:
    - REGISTRY="$HEMS_AGENT_ACR_REGISTRY_DEV"
    - REPO="$HEMS_AGENT_ACR_IMAGE_REPO_DEV"
    - USERNAME="$HEMS_AGENT_ACR_USERNAME_DEV"
    - PASSWORD="$HEMS_AGENT_ACR_PASSWORD_DEV"
    - IMAGE_REPO="$REGISTRY/$REPO"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - test -n "$REGISTRY"
    - test -n "$REPO"
    - test -n "$USERNAME"
    - test -n "$PASSWORD"
    - test "$REGISTRY" = "$EXPECTED_DEV_ACR_REGISTRY"
    - |
      if echo "$IMAGE_REPO" | grep -Eq '/fls-web($|[:/])'; then
        echo "Refusing to publish hems-agent-backend image into fls-web repository: $IMAGE_REPO"
        exit 1
      fi
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<CFG
      {"auths":{"$REGISTRY":{"username":"$USERNAME","password":"$PASSWORD"}}}
      CFG
    - /kaniko/executor
      --force
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_REPO:$IMAGE_TAG"
      --destination "$IMAGE_REPO:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_dev:
  stage: deploy
  image:
    # Use a fixed shell-capable helm image to avoid project/group variable overrides.
    name: alpine/helm:3.14.4
    entrypoint: [""]
  script:
    - REGISTRY="$HEMS_AGENT_ACR_REGISTRY_DEV"
    - REPO="$HEMS_AGENT_ACR_IMAGE_REPO_DEV"
    - USERNAME="$HEMS_AGENT_ACR_USERNAME_DEV"
    - PASSWORD="$HEMS_AGENT_ACR_PASSWORD_DEV"
    - IMAGE_REPO="$REGISTRY/$REPO"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - test -n "$REGISTRY"
    - test -n "$REPO"
    - test -n "$USERNAME"
    - test -n "$PASSWORD"
    - test "$REGISTRY" = "$EXPECTED_DEV_ACR_REGISTRY"
    - |
      if echo "$IMAGE_REPO" | grep -Eq '/fls-web($|[:/])'; then
        echo "Refusing to deploy hems-agent-backend image from fls-web repository: $IMAGE_REPO"
        exit 1
      fi
    - |
      KCTL="kubectl"
      if ! command -v kubectl >/dev/null 2>&1; then
        DL_OK=""
        for url in \
          "https://mirrors.aliyun.com/kubernetes-new/core/kubernetes-release/release/v1.29.15/bin/linux/amd64/kubectl"
        do
          if command -v wget >/dev/null 2>&1; then
            wget -qO kubectl -T 20 --tries=2 "$url" && DL_OK=1 && break
          else
            apk add --no-cache curl >/dev/null
            curl -fsSLo kubectl --connect-timeout 10 --max-time 30 "$url" && DL_OK=1 && break
          fi
        done
        test -n "$DL_OK"
        test -s kubectl
        chmod +x kubectl
        KCTL="$PWD/kubectl"
      fi
      echo "Using kubectl binary: $KCTL"
      echo "$KCTL" > .kctl_path
    - KCFG="$KUBECONFIG_B64_ACK_DEV"
    - test -n "$KCFG"
    - echo "$KCFG" | base64 -d > kubeconfig
    - chmod 600 kubeconfig
    - export KUBECONFIG="$PWD/kubeconfig"
    - KCTL="$(cat .kctl_path)"
    - $KCTL -n "$DEV_NAMESPACE" create secret docker-registry "$IMAGE_PULL_SECRET" --docker-server="$REGISTRY" --docker-username="$USERNAME" --docker-password="$PASSWORD" --dry-run=client -o yaml | $KCTL apply -f -
    - test -n "$HEMS_AGENT_ENV_B64"
    - echo "$HEMS_AGENT_ENV_B64" | base64 -d > runtime.raw.env
    - |
      awk '
      /^[[:space:]]*#/ || /^[[:space:]]*$/ {next}
      {
        line=$0
        sub(/^[[:space:]]+/, "", line)
        sub(/[[:space:]]+$/, "", line)
        if (index(line, "=") == 0) next
        key=substr(line, 1, index(line, "=")-1)
        val=substr(line, index(line, "=")+1)
        sub(/[[:space:]]+$/, "", key)
        sub(/^[[:space:]]+/, "", val)
        sub(/[[:space:]]+$/, "", val)
        if (val ~ /^".*"$/ || val ~ /^'\''.*'\''$/) {
          val=substr(val, 2, length(val)-2)
        }
        print key"="val
      }' runtime.raw.env > runtime.env
    - $KCTL -n "$DEV_NAMESPACE" create secret generic "$ENV_SECRET_NAME" --from-env-file=runtime.env --dry-run=client -o yaml | $KCTL apply -f -
    - helm upgrade --install "$HELM_RELEASE" "$CHART_DIR"
      --namespace "$DEV_NAMESPACE"
      --values "$CHART_DIR/values-dev.yaml"
      --set imagePullSecrets[0].name="$IMAGE_PULL_SECRET"
      --set image.repository="$IMAGE_REPO"
      --set image.tag="$IMAGE_TAG"
      --set envFromSecret="$ENV_SECRET_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

smoke_dev:
  stage: smoke
  image:
    name: docker.m.daocloud.io/alpine/k8s:1.29.15
    entrypoint: [""]
  script:
    - KCFG="$KUBECONFIG_B64_ACK_DEV"
    - test -n "$KCFG"
    - echo "$KCFG" | base64 -d > kubeconfig
    - chmod 600 kubeconfig
    - export KUBECONFIG="$PWD/kubeconfig"
    - |
      if ! kubectl -n "$DEV_NAMESPACE" rollout status deploy/"$HELM_RELEASE" --timeout=240s; then
        kubectl -n "$DEV_NAMESPACE" get deploy/"$HELM_RELEASE" -o wide || true
        kubectl -n "$DEV_NAMESPACE" get pod -l app.kubernetes.io/instance="$HELM_RELEASE" -o wide || true
        for p in $(kubectl -n "$DEV_NAMESPACE" get pod -l app.kubernetes.io/instance="$HELM_RELEASE" -o name); do
          echo "===== describe $p ====="
          kubectl -n "$DEV_NAMESPACE" describe "$p" || true
          echo "===== logs $p ====="
          kubectl -n "$DEV_NAMESPACE" logs "$p" --tail=200 2>/dev/null || true
          echo "===== previous logs $p ====="
          kubectl -n "$DEV_NAMESPACE" logs "$p" --previous --tail=200 2>/dev/null || true
        done
        exit 1
      fi
    - kubectl -n "$DEV_NAMESPACE" run smoke --rm -i --restart=Never --image="$CURL_IMAGE" -- curl -fsS "http://$HELM_RELEASE/readyz" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build_image_shanghai:
  stage: build
  image:
    name: $SH_KANIKO_IMAGE
    entrypoint: [""]
  tags: ["ack-sh-dev"]
  variables:
    GIT_STRATEGY: "none"
  script:
    - *fetch_sh_ci_context
    - REGISTRY="${HEMS_AGENT_ACR_REGISTRY_SH_DEV:-$SH_ACR_REGISTRY}"
    - REPO="${HEMS_AGENT_ACR_IMAGE_REPO_SH_DEV:-$SH_ACR_IMAGE_REPO}"
    - USERNAME="$HEMS_AGENT_ACR_USERNAME_SH_DEV"
    - PASSWORD="$HEMS_AGENT_ACR_PASSWORD_SH_DEV"
    - IMAGE_REPO="$REGISTRY/$REPO"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - test -n "$REGISTRY"
    - test -n "$REPO"
    - test -n "$USERNAME"
    - test -n "$PASSWORD"
    - |
      if echo "$IMAGE_REPO" | grep -Eq '/fls-web($|[:/])'; then
        echo "Refusing to publish hems-agent-backend image into fls-web repository: $IMAGE_REPO"
        exit 1
      fi
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<CFG
      {"auths":{"$REGISTRY":{"username":"$USERNAME","password":"$PASSWORD"}}}
      CFG
    - /kaniko/executor
      --force
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg PYTHON_BASE_IMAGE="$SH_PYTHON_BASE_IMAGE"
      --build-arg PIP_INDEX_URL="$SH_PIP_INDEX_URL"
      --build-arg PIP_TRUSTED_HOST="$SH_PIP_TRUSTED_HOST"
      --destination "$IMAGE_REPO:$IMAGE_TAG"
      --destination "$IMAGE_REPO:develop-latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "sh-develop"'

deploy_shanghai_dev:
  stage: deploy
  image:
    name: $SH_KUBECTL_IMAGE
    entrypoint: [""]
  tags: ["ack-sh-dev"]
  variables:
    GIT_STRATEGY: "none"
  needs: ["build_image_shanghai"]
  script:
    - *fetch_sh_ci_context
    - REGISTRY="${HEMS_AGENT_ACR_REGISTRY_SH_DEV:-$SH_ACR_REGISTRY}"
    - REPO="${HEMS_AGENT_ACR_IMAGE_REPO_SH_DEV:-$SH_ACR_IMAGE_REPO}"
    - USERNAME="$HEMS_AGENT_ACR_USERNAME_SH_DEV"
    - PASSWORD="$HEMS_AGENT_ACR_PASSWORD_SH_DEV"
    - IMAGE_REPO="$REGISTRY/$REPO"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - KCFG="$KUBECONFIG_B64_ACK_SH_DEV"
    - test -n "$REGISTRY"
    - test -n "$REPO"
    - test -n "$USERNAME"
    - test -n "$PASSWORD"
    - test -n "$KCFG"
    - echo "$KCFG" | base64 -d > kubeconfig
    - chmod 600 kubeconfig
    - export KUBECONFIG="$PWD/kubeconfig"
    - kubectl -n "$SH_DEV_NAMESPACE" create secret docker-registry "$SH_IMAGE_PULL_SECRET" --docker-server="$REGISTRY" --docker-username="$USERNAME" --docker-password="$PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - ENV_B64="${HEMS_AGENT_ENV_B64_SH_DEV:-$HEMS_AGENT_ENV_B64}"
    - test -n "$ENV_B64"
    - echo "$ENV_B64" | base64 -d > runtime.raw.env
    - |
      awk '
      /^[[:space:]]*#/ || /^[[:space:]]*$/ {next}
      {
        line=$0
        sub(/^[[:space:]]+/, "", line)
        sub(/[[:space:]]+$/, "", line)
        if (index(line, "=") == 0) next
        key=substr(line, 1, index(line, "=")-1)
        val=substr(line, index(line, "=")+1)
        sub(/[[:space:]]+$/, "", key)
        sub(/^[[:space:]]+/, "", val)
        sub(/[[:space:]]+$/, "", val)
        if (val ~ /^".*"$/ || val ~ /^'\''.*'\''$/) {
          val=substr(val, 2, length(val)-2)
        }
        print key"="val
      }' runtime.raw.env > runtime.env
    - kubectl -n "$SH_DEV_NAMESPACE" create secret generic "$SH_ENV_SECRET_NAME" --from-env-file=runtime.env --dry-run=client -o yaml | kubectl apply -f -
    - helm upgrade --install "$HELM_RELEASE" "$CHART_DIR"
      --namespace "$SH_DEV_NAMESPACE"
      --values "$CHART_DIR/values-sh-dev.yaml"
      --set imagePullSecrets[0].name="$SH_IMAGE_PULL_SECRET"
      --set image.repository="$IMAGE_REPO"
      --set image.tag="$IMAGE_TAG"
      --set envFromSecret="$SH_ENV_SECRET_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == "sh-develop"'

smoke_shanghai_dev:
  stage: smoke
  image:
    name: $SH_KUBECTL_IMAGE
    entrypoint: [""]
  tags: ["ack-sh-dev"]
  variables:
    GIT_STRATEGY: "none"
  needs: ["deploy_shanghai_dev"]
  script:
    - KCFG="$KUBECONFIG_B64_ACK_SH_DEV"
    - test -n "$KCFG"
    - echo "$KCFG" | base64 -d > kubeconfig
    - chmod 600 kubeconfig
    - export KUBECONFIG="$PWD/kubeconfig"
    - kubectl -n "$SH_DEV_NAMESPACE" rollout status deploy/"$HELM_RELEASE" --timeout=300s
    - kubectl -n "$SH_DEV_NAMESPACE" run smoke-sh-hems --rm -i --restart=Never --image="$SH_CURL_IMAGE" -- curl -fsS "http://$HELM_RELEASE/readyz"
  rules:
    - if: '$CI_COMMIT_BRANCH == "sh-develop"'

build_image_aws:
  stage: build
  image:
    name: $BUILDAH_IMAGE
    entrypoint: [""]
  tags: ["aws-dev-eks"]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  script:
    - IMAGE_REPO="${AWS_ECR_REGISTRY}/${AWS_ECR_REPOSITORY}"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - test -n "$AWS_REGION"
    - test -n "$AWS_ECR_REGISTRY"
    - test -n "$AWS_ECR_REPOSITORY"
    - |
      if command -v dnf >/dev/null 2>&1; then
        dnf install -y awscli
      elif command -v microdnf >/dev/null 2>&1; then
        microdnf install -y awscli
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache aws-cli
      fi
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_REGION" | buildah login -u AWS --password-stdin "$AWS_ECR_REGISTRY"
    - buildah build -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:develop-latest" .
    - buildah push "$IMAGE_REPO:$IMAGE_TAG"
    - buildah push "$IMAGE_REPO:develop-latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_aws_dev:
  stage: deploy
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  tags: ["aws-dev-eks"]
  needs: ["build_image_aws"]
  script:
    - IMAGE_REPO="${AWS_ECR_REGISTRY}/${AWS_ECR_REPOSITORY}"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - test -n "$AWS_DEV_NAMESPACE"
    - test -n "$HEMS_AGENT_ENV_B64"
    - |
      KCTL="kubectl"
      if ! command -v kubectl >/dev/null 2>&1; then
        DL_OK=""
        for url in \
          "https://mirrors.aliyun.com/kubernetes-new/core/kubernetes-release/release/v1.29.15/bin/linux/amd64/kubectl"
        do
          if command -v wget >/dev/null 2>&1; then
            wget -qO kubectl -T 20 --tries=2 "$url" && DL_OK=1 && break
          else
            apk add --no-cache curl >/dev/null
            curl -fsSLo kubectl --connect-timeout 10 --max-time 30 "$url" && DL_OK=1 && break
          fi
        done
        test -n "$DL_OK"
        test -s kubectl
        chmod +x kubectl
        KCTL="$PWD/kubectl"
      fi
      echo "$KCTL" > .kctl_path
    - KCTL="$(cat .kctl_path)"
    - echo "$HEMS_AGENT_ENV_B64" | base64 -d > runtime.raw.env
    - |
      awk '
      /^[[:space:]]*#/ || /^[[:space:]]*$/ {next}
      {
        line=$0
        sub(/^[[:space:]]+/, "", line)
        sub(/[[:space:]]+$/, "", line)
        if (index(line, "=") == 0) next
        key=substr(line, 1, index(line, "=")-1)
        val=substr(line, index(line, "=")+1)
        sub(/[[:space:]]+$/, "", key)
        sub(/^[[:space:]]+/, "", val)
        sub(/[[:space:]]+$/, "", val)
        if (val ~ /^".*"$/ || val ~ /^'\''.*'\''$/) {
          val=substr(val, 2, length(val)-2)
        }
        print key"="val
      }' runtime.raw.env > runtime.env
    - $KCTL -n "$AWS_DEV_NAMESPACE" create secret generic "$ENV_SECRET_NAME" --from-env-file=runtime.env --dry-run=client -o yaml | $KCTL apply -f -
    - helm upgrade --install "$HELM_RELEASE" "$CHART_DIR"
      --namespace "$AWS_DEV_NAMESPACE"
      --values "$CHART_DIR/values-eks-dev.yaml"
      --set image.repository="$IMAGE_REPO"
      --set image.tag="$IMAGE_TAG"
      --set envFromSecret="$ENV_SECRET_NAME"
      --set-string env.OPENVIKING_URL="http://openviking:1933"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

smoke_aws_dev:
  stage: smoke
  image:
    name: docker.m.daocloud.io/alpine/k8s:1.29.15
    entrypoint: [""]
  tags: ["aws-dev-eks"]
  needs: ["deploy_aws_dev"]
  script:
    - kubectl -n "$AWS_DEV_NAMESPACE" rollout status deploy/"$HELM_RELEASE" --timeout=300s
    - kubectl -n "$AWS_DEV_NAMESPACE" run smoke-aws-hems --rm -i --restart=Never --image="$CURL_IMAGE" -- curl -fsS "http://$HELM_RELEASE/readyz"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
